[package]
name = "pdf-indexer"
version = "0.1.0"
edition = "2021"
description = "Inject a navigable table-of-contents outline (bookmarks) into any PDF"
license = "MIT"
repository = "https://github.com/elcid/pdf-indexer"
keywords = ["pdf", "outline", "bookmarks", "toc", "pdf-tools"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["*.pdf", "sicp-outline.json"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.40"
anyhow = "1.0"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
